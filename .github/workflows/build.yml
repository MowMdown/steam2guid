# Builds steam2guid when a release is published and attaches the binaries to
# it. Pushing commits builds nothing.
#
# Only releases whose tag starts with "v" (v1.0.0, v1.2.3, ...) build, so
# table releases such as table-v1 are left alone.

name: Build

on:
  release:
    types: [ published ]

permissions:
  contents: write   # to upload the binaries to the release

jobs:

  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - { goos: linux,   goarch: amd64 }
        - { goos: linux,   goarch: arm64 }
        - { goos: windows, goarch: amd64, ext: .exe }
        - { goos: darwin,  goarch: arm64 }
    steps:
    - uses: actions/checkout@v4   # the commit the release's tag points to

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod   # use the version go.mod asks for

    - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"   # standard library only: a static binary that runs anywhere
      run: go build -trimpath -ldflags "-s -w" -o "dist/steam2guid-${GOOS}-${GOARCH}${{ matrix.ext }}" .

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" dist/* --clobber
